<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<title>Alizée Famechon – Restauratrice art du feu</title>
<meta name="description" content="Portfolio d’Alizée Famechon, conservatrice-restauratrice de céramique et de verre : réalisations avant / après, kintsugi, CV et contact.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:ital,wght@0,400;0,500;0,600;1,400&display=swap">
<link rel="preload" href="fonts/aruma.otf" as="font" type="font/otf" crossorigin>
<link rel="stylesheet" href="style.css">
<!-- three.js : chargé seulement quand le vase 3D de l'accueil démarre -->
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
</head>
<body>
<div class="glass" id="glass" aria-hidden="true"></div>
<div class="progress" id="progress" aria-hidden="true"></div>

<header class="nav" id="nav">
  <a class="brand" href="#accueil" id="brand"></a>
  <nav id="links" aria-label="Navigation principale"></nav>
  <button class="pill" id="lang" type="button" aria-label="Changer de langue / Switch language">EN</button>
  <button class="menu" id="menu" type="button" aria-label="Menu" aria-expanded="false"><span></span></button>
</header>

<main>
  <section class="hero page" id="accueil" data-view>
    <div class="wrap hero-grid">
      <div class="hero-text">
        <h1 id="heroName"></h1>
        <p class="role" id="heroRole"></p>
        <p class="lede" id="heroLede"></p>
        <a class="btn" id="heroBtn" href="#experience"></a>
      </div>
      <div class="hero-art" id="heroArt">
        <svg class="vase" id="vase" viewBox="0 0 400 560" role="img" aria-label="Vase réparé au kintsugi"></svg>
        <div class="vase3d" id="vase3d" role="img" aria-label="Vase en 3D qui se brise puis est réparé au kintsugi"></div>
        <p class="hint" id="hint"></p>
      </div>
    </div>
    <svg class="scallop" aria-hidden="true" preserveAspectRatio="none"><defs><pattern id="sc" width="72" height="40" patternUnits="userSpaceOnUse"><path d="M0 40 A36 36 0 0 1 72 40" fill="none" stroke="var(--gold)" stroke-width="2" opacity=".8"/></pattern></defs><rect width="100%" height="40" fill="url(#sc)"/></svg>
  </section>

  <div id="sections"></div>
</main>

<footer id="footer"></footer>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<dialog class="lb" id="lb" aria-label="Détail">
  <button class="lb-x" id="lbx" type="button" aria-label="Fermer"><svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M3 3l12 12M15 3L3 15"/></svg></button>
  <div class="lb-body" id="lbb"></div>
</dialog>

<script src="contenu.js"></script>
<script src="site.js"></script>
</body>
</html>
